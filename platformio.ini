; kopernik-ultrasonic - PlatformIO build. Arduino IDE users: ignore this file, see kopernik-ultrasonic.ino
[platformio]
src_dir = .
default_envs = supermini
; Any *-local.ini here is loaded on top of this file, and is where the enrolment secret goes - a
; platformio-secrets-local.ini defining build_flags_secrets, as the library's examples use.
; Without one the node is refused and listed on the dashboard's Nodes card for approval.
extra_configs = *-local.ini

[common]
build_flags_secrets =
platform_esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; The same settings as platform.h, less the per-board ones
build_flags =
    ${common.build_flags_secrets}
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
    '-D SYSTEM_OTA_PREFIX="kopernik-ultrasonic"'
    -D SENSOR_HCSR04_MIN_MM=200            ; SR04M-2 / AJ-SR04M: its blind zone is ~20cm. HC-SR04: delete these three
    -D SENSOR_HCSR04_MAX_MM=4500
    -D SENSOR_HCSR04_TRIGGER_US=100        ; The module, run at 3V3, misses the default 10us trigger
    -D SENSOR_HCSR04_DEBUG                 ; Comment out to stop printing every ping
    -D SYSTEM_WIFI_DEBUG                   ; Comment out to stop debugging WIFI connection attempts
    -D SYSTEM_MQTT_DEBUG                   ; Comment out to stop debugging MQTT interactions

[env]
framework = arduino
platform = ${common.platform_esp32}
monitor_speed = 460800
upload_speed = 460800
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    ; symlink:///Users/mitra/Documents/Arduino/frugal-iot-demo/lib/Frugal-IoT ; use a local copy of library
    Frugal-IoT@^2.0.13 ; The released library

[env:supermini] ; ESP32-C3 SuperMini, and the SuperMini Pro
board = nologo_esp32c3_super_mini ; defines only ARDUINO_ESP32C3_DEV, hence SUPERMINI below
build_flags =
    ${common.build_flags}
    -D SUPERMINI ; The Arduino IDE's ARDUINO_NOLOGO_ESP32C3_SUPER_MINI, for the #if in the sketch
    '-D SYSTEM_OTA_SUFFIX="supermini"'

[env:c3_oled_72x40_nobatt] ; ESP32-C3 with a 0.42" 72x40 OLED, no battery
board = lolin_c3_mini ; enables native USB-CDC (ARDUINO_USB_CDC_ON_BOOT=1)
board_build.variant = lolin_c3_pico ; same SDA/SCL/USB as lolin_c3_mini variant; kept as known-working config
build_flags =
    ${common.build_flags}
    -D C3_OLED_72X40_NOBATT ; for the #if in the sketch
    -D ARDUINO_C3_OLED_72x40 ; tells the library which display, and that there is no battery on 3
    -D ACTUATOR_OLED_WANT
    '-D SYSTEM_OTA_SUFFIX="c3_oled_72x40_nobatt"'
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.10.13
